<title>November 2021 Paper 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#F0F4F2;
    --paper-grid:#DCE6E1;
    --panel:#FFFFFF;
    --ink:#132022;
    --ink-soft:#4B5E60;
    --ink-faint:#7C8C8D;
    --line:#D2DEDA;
    --accent:#136B77;
    --accent-strong:#0B4E58;
    --accent-soft:#E0EFEE;
    --amber:#B5731A;
    --amber-soft:#F7E9D2;
    --good:#2E7D4F;
    --good-soft:#DEF0E3;
    --bad:#B5432E;
    --bad-soft:#F8E2DD;
    --shadow: 0 1px 2px rgba(19,32,34,0.06), 0 8px 24px -12px rgba(19,32,34,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1618;
      --paper-grid:#182225;
      --panel:#141F22;
      --ink:#E7EEEC;
      --ink-soft:#9DB0AE;
      --ink-faint:#71898A;
      --line:#233335;
      --accent:#4FC3D1;
      --accent-strong:#7BDCE7;
      --accent-soft:#152B2E;
      --amber:#E3A24E;
      --amber-soft:#2C2114;
      --good:#6FCB95;
      --good-soft:#122B1C;
      --bad:#E68A75;
      --bad-soft:#301917;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1618;
    --paper-grid:#182225;
    --panel:#141F22;
    --ink:#E7EEEC;
    --ink-soft:#9DB0AE;
    --ink-faint:#71898A;
    --line:#233335;
    --accent:#4FC3D1;
    --accent-strong:#7BDCE7;
    --accent-soft:#152B2E;
    --amber:#E3A24E;
    --amber-soft:#2C2114;
    --good:#6FCB95;
    --good-soft:#122B1C;
    --bad:#E68A75;
    --bad-soft:#301917;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    background-blend-mode: normal;
    color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; }
  code, .formula{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .wrap{ max-width:760px; margin:0 auto; padding:28px 20px 90px; }

  /* ---------- Header ---------- */
  .masthead{ margin-bottom:22px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent-strong); font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; }
  .masthead h1{ font-size:clamp(26px,4vw,34px); font-weight:600; margin-top:6px; color:var(--ink); }
  .masthead p{ color:var(--ink-soft); margin:6px 0 0; font-size:15px; max-width:52ch; }

  /* ---------- Burette progress ---------- */
  .burette-row{
    display:flex; align-items:center; gap:16px; margin-top:20px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .burette{ position:relative; flex:0 0 auto; width:230px; height:34px; }
  .burette-tube{
    position:absolute; inset:0; border:1.5px solid var(--ink-faint); border-radius:4px;
    background:
      repeating-linear-gradient(90deg, var(--ink-faint) 0 1px, transparent 1px 19.16px);
    background-color: transparent;
    overflow:hidden;
  }
  .burette-fill{
    position:absolute; top:0; left:0; bottom:0; width:0%;
    background:linear-gradient(90deg, var(--accent-soft), var(--accent));
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .burette-tube::after{
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 18.16px, var(--ink-faint) 18.16px 19.16px);
    opacity:.55; pointer-events:none;
  }
  .burette-label{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
  .burette-label b{ color:var(--ink); font-weight:600; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
    padding:5px 9px; border-radius:6px; cursor:pointer; transition:.15s;
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .chip.is-current{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
  .chip.is-done{ background:var(--good-soft); color:var(--good); border-color:var(--good); }
  .chip.is-done::before{ content:'\2713\0020'; }

  /* ---------- Concept panel ---------- */
  .concept{
    background:var(--accent-soft); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:8px; padding:16px 18px; margin:22px 0 18px;
  }
  .concept summary{ cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .concept summary::-webkit-details-marker{ display:none; }
  .concept-title{ font-weight:600; color:var(--accent-strong); font-size:15px; display:flex; align-items:center; gap:8px; }
  .concept-title .tag{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; background:var(--accent); color:var(--panel); padding:2px 6px; border-radius:4px; }
  .concept .chevron{ color:var(--accent-strong); transition:transform .2s; font-size:13px; }
  .concept[open] .chevron{ transform:rotate(90deg); }
  .concept-body{ margin-top:12px; font-size:14.5px; color:var(--ink); }
  .concept-body p{ margin:0 0 10px; }
  .concept-body p:last-child{ margin-bottom:0; }
  .concept-body .worked{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:10px 0; font-size:13.5px;
  }
  .concept-body table{ border-collapse:collapse; width:100%; font-size:13px; margin:8px 0; }
  .concept-body th, .concept-body td{ border:1px solid var(--line); padding:5px 8px; text-align:left; }
  .concept-body th{ background:var(--panel); font-weight:600; }

  /* ---------- Question card ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:24px 24px 22px; box-shadow:var(--shadow);
  }
  .qhead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .qnum{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--amber); font-size:14px; letter-spacing:.03em; }
  .qtitle{ font-size:19px; font-weight:600; color:var(--ink); }
  .qprompt{ margin-top:10px; font-size:15px; color:var(--ink); }
  .qprompt p{ margin:0 0 10px; }
  .aside{
    margin:14px 0; border:1px dashed var(--line); border-radius:8px; background:var(--paper);
  }
  .aside summary{ cursor:pointer; list-style:none; padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px; }
  .aside summary::-webkit-details-marker{ display:none; }
  .aside summary::before{ content:'\25B8'; color:var(--accent); transition:transform .2s; display:inline-block; }
  .aside[open] summary::before{ transform:rotate(90deg); }
  .aside-body{ padding:0 16px 16px; font-size:13.5px; }
  .orbital-row{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .orbital-cell{ text-align:center; }
  .orbital-cell span{ display:block; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
  .model-svg{ text-align:center; margin:10px 0; }
  .model-svg svg{ max-width:100%; height:auto; }

  .given{
    margin:12px 0; border-collapse:collapse; width:100%; font-size:13.5px;
  }
  .given th, .given td{ border:1px solid var(--line); padding:6px 9px; text-align:left; }
  .given th{ background:var(--paper); font-weight:600; color:var(--ink-soft); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .given td.num{ font-family:'IBM Plex Mono',monospace; }

  .worktable{ margin:14px 0; }
  .worktable-title{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
  .worktable table{ border-collapse:collapse; width:100%; font-size:13.5px; }
  .worktable th, .worktable td{ border:1px solid var(--line); padding:5px 7px; }
  .worktable th{ background:var(--paper); font-weight:600; color:var(--ink-soft); font-size:12px; }
  .worktable input.cell{
    width:100%; border:none; background:transparent; font-family:'IBM Plex Mono',monospace; font-size:13.5px;
    color:var(--ink); padding:2px 3px; border-radius:3px;
  }
  .worktable input.cell:focus{ background:var(--accent-soft); }
  .worktable input.cell.ok{ background:var(--good-soft); }
  .worktable input.cell.no{ background:var(--bad-soft); }
  .worktable-actions{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .worktable-note{ font-size:12.5px; color:var(--ink-faint); }

  .parts{ margin-top:16px; display:flex; flex-direction:column; gap:14px; }
  .part{ }
  .part-label{ font-size:14px; color:var(--ink); margin-bottom:6px; font-weight:500; }
  .part-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .answer-input{
    font-family:'IBM Plex Mono',monospace; font-size:15px; padding:8px 11px;
    border:1.5px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink);
    min-width:160px; transition:border-color .15s;
  }
  .answer-input:focus{ border-color:var(--accent); background:var(--panel); }
  .answer-input.correct{ border-color:var(--good); background:var(--good-soft); }
  .answer-input.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
  textarea.answer-input{ width:100%; min-height:64px; resize:vertical; line-height:1.5; }
  .unit{ color:var(--ink-faint); font-size:13.5px; }
  .part-feedback{ font-size:13px; margin-top:5px; min-height:1.3em; }
  .part-feedback.good{ color:var(--good); }
  .part-feedback.bad{ color:var(--bad); }

  .mc-options{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .mc-opt{
    display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:8px;
    padding:9px 12px; cursor:pointer; background:var(--paper); font-size:14.5px; transition:.15s;
  }
  .mc-opt:hover{ border-color:var(--accent); }
  .mc-opt input{ accent-color:var(--accent); }
  .mc-opt.correct{ border-color:var(--good); background:var(--good-soft); }
  .mc-opt.incorrect{ border-color:var(--bad); background:var(--bad-soft); }
  .mc-opt.disabled{ pointer-events:none; opacity:.85; }

  .btn{
    font-size:14px; font-weight:600; border-radius:7px; padding:9px 16px; cursor:pointer;
    border:1.5px solid transparent; transition:.15s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-primary:disabled{ background:var(--ink-faint); cursor:not-allowed; opacity:.55; }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .btn-amber{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber-soft); }
  .btn-amber:hover{ border-color:var(--amber); }
  .btn-sm{ font-size:12.5px; padding:6px 11px; border-radius:6px; }

  .action-row{ display:flex; align-items:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .hint-box{
    margin-top:12px; background:var(--amber-soft); border:1px dashed var(--amber); border-radius:8px;
    padding:10px 14px; font-size:13.5px; color:var(--ink);
  }
  .hint-box ol{ margin:0; padding-left:18px; }
  .hint-box li{ margin-bottom:4px; }
  .hint-box li:last-child{ margin-bottom:0; }

  .banner{
    margin-top:16px; border-radius:8px; padding:12px 15px; font-size:14.5px; display:none;
    align-items:flex-start; gap:9px;
  }
  .banner.show{ display:flex; }
  .banner.good{ background:var(--good-soft); color:var(--good); }
  .banner.bad{ background:var(--bad-soft); color:var(--bad); }
  .banner .icon{ font-size:16px; line-height:1.3; }

  .explain{
    margin-top:14px; background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; font-size:14px;
  }
  .explain-title{ font-weight:600; color:var(--ink); margin-bottom:6px; font-size:13.5px; text-transform:uppercase; letter-spacing:.04em; }
  .explain table{ border-collapse:collapse; width:100%; font-size:13px; margin:8px 0; }
  .explain th, .explain td{ border:1px solid var(--line); padding:5px 8px; }
  .explain th{ background:var(--panel); font-weight:600; }

  .footer-nav{ display:flex; justify-content:space-between; margin-top:26px; }

  .complete-card{ text-align:center; padding:40px 24px; }
  .complete-card .big{ font-size:44px; }
  .score-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0; }
  .score-tile{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 8px; }
  .score-tile b{ display:block; font-family:'IBM Plex Mono',monospace; font-size:24px; color:var(--accent-strong); }
  .score-tile span{ font-size:12px; color:var(--ink-soft); }

  @media (max-width:520px){
    .burette{ width:150px; }
    .score-grid{ grid-template-columns:1fr; }
  }

  /* ---------- Calculator ---------- */
  .calc-fab{
    position:fixed; right:22px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:24px; box-shadow:var(--shadow);
    cursor:pointer; z-index:500; display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .calc-fab:hover{ background:var(--accent-strong); transform:scale(1.05); }
  .calc-panel{
    position:fixed; right:22px; bottom:90px; width:300px; max-width:92vw; max-height:80vh;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); z-index:500; overflow:hidden; display:none; flex-direction:column;
  }
  .calc-panel.open{ display:flex; }
  .calc-header{
    display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    background:var(--paper); border-bottom:1px solid var(--line); cursor:grab; touch-action:none;
    user-select:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase; flex-shrink:0;
  }
  .calc-header .calc-title{ display:flex; align-items:center; }
  .calc-header .mem-badge{
    margin-left:7px; font-size:9.5px; padding:1px 5px; border-radius:4px; letter-spacing:.03em;
    background:var(--accent-soft); color:var(--accent-strong); visibility:hidden;
  }
  .calc-header button{ background:none; border:none; color:var(--ink-faint); font-size:17px; cursor:pointer; padding:2px 6px; line-height:1; }
  .calc-header button:hover{ color:var(--bad); }
  .calc-display{ padding:14px 14px 8px; text-align:right; flex-shrink:0; }
  .calc-display .expr{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); min-height:14px; overflow-wrap:anywhere; }
  .calc-display .val{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--ink); font-weight:600; overflow-wrap:anywhere; margin-top:2px; }
  .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px 12px 14px; overflow-y:auto; min-height:0; }
  .calc-btn{
    border:none; border-radius:8px; padding:11px 0; font-family:'IBM Plex Mono',monospace; font-size:14px;
    font-weight:600; cursor:pointer; background:var(--paper); color:var(--ink); transition:.1s;
  }
  .calc-btn:hover{ filter:brightness(1.1); }
  .calc-btn:active{ transform:scale(0.94); }
  .calc-btn.fn{ background:var(--accent-soft); color:var(--accent-strong); font-size:12.5px; }
  .calc-btn.op{ background:var(--amber-soft); color:var(--amber); }
  .calc-btn.eq{ background:var(--accent); color:#fff; }
  .calc-btn.ctrl{ background:var(--bad-soft); color:var(--bad); }
  .calc-btn.mem{ background:var(--paper); color:var(--accent-strong); border:1px solid var(--line); font-size:12.5px; }
</style>

<div class="wrap">

    <div class="eyebrow">IB Chemistry HL &middot; Paper 2</div>
    <h1>November 2021 Paper 2</h1>
    <p>A worked path through the selected questions from the November 2021 HL Paper 2 exam &mdash; read the idea, try the numbers, get a nudge if you're stuck.</p>

    <div class="burette-row">
      <div class="burette">
        <div class="burette-tube"><div class="burette-fill" id="buretteFill"></div></div>
      </div>
      <div class="burette-label"><b id="progressCount">0</b> of <span id="progressTotal">12</span> questions solved</div>

  <div class="calc-header" id="calcHeader"><span class="calc-title">Calculator<span class="mem-badge" id="calcMemInd">M</span></span><button type="button" id="calcClose" aria-label="Close calculator">&times;</button></div>

    <div class="val" id="calcVal">0</div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============ chemistry helpers ============ */
  const AR = { H:1.008, C:12.01, N:14.01, O:16.00, Na:22.99, S:32.07, P:30.97, Co:58.93, Cd:112.41, Se:78.97, Te:127.60, Li:6.94 };

  function parseFormula(str){
    if (!str) return null;
    let s = String(str).trim().replace(/\s+/g,'');
    if (!s) return null;
    s = s.replace(/[\u00B7\u2022\u2219]/g,'.').replace(/\*/g,'.');
    if (!/^[A-Za-z0-9.]+$/.test(s)) return null;
    const parts = s.split('.').filter(Boolean);
    if (!parts.length) return null;
    const counts = {};
    for (const part of parts){
      let mult = 1, rest = part;
      const lead = part.match(/^(\d+)([A-Za-z].*)$/);
      if (lead){ mult = parseInt(lead[1],10); rest = lead[2]; }
      const re = /([A-Z][a-z]?)(\d*)/g;
      let m, consumed = 0;
      while ((m = re.exec(rest)) !== null){
        if (m[0] === ''){ re.lastIndex++; continue; }
        consumed += m[0].length;
        const el = m[1];
        const n = m[2] ? parseInt(m[2],10) : 1;
        counts[el] = (counts[el]||0) + n*mult;
      }
      if (consumed !== rest.length) return null;
    }
    return counts;
  }
  function gcd2(a,b){ a=Math.round(a); b=Math.round(b); return b===0?a:gcd2(b,a%b); }
  function reduceCounts(counts){
    const vals = Object.values(counts).filter(v=>v>0);
    if (!vals.length) return counts;
    let g = vals[0];
    for (const v of vals) g = gcd2(g,v);
    const out = {};
    for (const k in counts) out[k] = counts[k]/g;
    return out;
  }
  function countsEqual(a,b){
    const ka = Object.keys(a).filter(k=>a[k]!==0);
    const kb = Object.keys(b).filter(k=>b[k]!==0);
    if (ka.length !== kb.length) return false;
    return ka.every(k => b[k] === a[k]);
  }
  function checkEmpirical(userStr, correctStr){
    const u = parseFormula(userStr), c = parseFormula(correctStr);
    if (!u || !c) return false;
    return countsEqual(reduceCounts(u), reduceCounts(c));
  }
  function checkMolecular(userStr, correctStr){
    const u = parseFormula(userStr), c = parseFormula(correctStr);
    if (!u || !c) return false;
    return countsEqual(u, c);
  }
  function checkNumeric(userStr, correct, tolPct, tolAbs){
    tolPct = tolPct===undefined?0.05:tolPct; tolAbs = tolAbs===undefined?0:tolAbs;
    const v = parseFloat(userStr);
    if (isNaN(v)) return false;
    const tol = Math.max(tolAbs, Math.abs(correct)*tolPct);
    return Math.abs(v-correct) <= tol;
  }
  function fmtFormula(str){
    return str.replace(/([A-Za-z])(\d+)/g,'$1<sub>$2</sub>').replace(/\./g,'&middot;');
  }
  function checkKeywords(userStr, groups){
    const v = (userStr||'').toLowerCase();
    return groups.every(group => group.some(kw => v.includes(kw.toLowerCase())));
  }
  function checkEquation(userStr, required, forbidden){
    const norm = (userStr||'').replace(/[^A-Za-z0-9]/g,'').toLowerCase();
    const req = required.map(t=>t.replace(/[^A-Za-z0-9]/g,'').toLowerCase());
    const forb = (forbidden||[]).map(t=>t.replace(/[^A-Za-z0-9]/g,'').toLowerCase());
    const hasAll = req.every(tok => norm.includes(tok));
    const hasNone = !forb.some(tok => norm.includes(tok));
    return hasAll && hasNone;
  }
  function extractBracketTokens(str){
    const re = /\[([^\]]+)\]/g;
    let m; const out = [];
    while ((m = re.exec(str)) !== null) out.push(m[1].replace(/\s+/g,'').toLowerCase());
    return out;
  }
  function checkKcExpression(userStr, numerator, denominator){
    const s = (userStr||'').trim();
    const idx = s.indexOf('/');
    if (idx < 0) return false;
    const numTokens = extractBracketTokens(s.slice(0, idx)).sort();
    const denTokens = extractBracketTokens(s.slice(idx+1)).sort();
    const wantNum = numerator.map(x=>x.toLowerCase()).sort();
    const wantDen = denominator.map(x=>x.toLowerCase()).sort();
    return JSON.stringify(numTokens) === JSON.stringify(wantNum) && JSON.stringify(denTokens) === JSON.stringify(wantDen);
  }

  /* ============ state ============ */
  const state = { current:0, solved:new Set(), attempts:{}, revealedHints:{}, gaveUp:new Set(), firstTry:new Set() };

  const buretteFill = document.getElementById('buretteFill');
  const progressCount = document.getElementById('progressCount');
  document.getElementById('progressTotal').textContent = Q.length;

  function buildChips(){
    chipRow.innerHTML = '';
    Q.forEach((q,i)=>{
      const c = document.createElement('button');
      c.type='button'; c.className='chip'; c.textContent = 'Q'+(q.chip || q.num);
      if (i===state.current) c.classList.add('is-current');
      if (state.solved.has(q.id)) c.classList.add('is-done');
      c.addEventListener('click', ()=> goTo(i));
      chipRow.appendChild(c);
    });
  }
  function updateProgress(){
    const pct = Math.round((state.solved.size/Q.length)*100);
    buretteFill.style.width = pct+'%';
    progressCount.textContent = state.solved.size;
    buildChips();
  }
  function goTo(i){
    state.current = i;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function partKey(qid, pid){ return qid+':'+pid; }

  function renderConceptOpen(conceptKey, seenBefore){
    const c = CONCEPTS[conceptKey];
    const det = document.createElement('details');
    det.className = 'concept';
    det.open = !seenBefore;
    det.innerHTML = `<summary><span class="concept-title"><span class="tag">${c.tag}</span>${c.title}</span><span class="chevron">&#9656;</span></summary>
      <div class="concept-body">${c.body}</div>`;
    return det;
  }

  function buildWorkTable(q){
    const w = q.work;
    if (!w) return null;
    const box = document.createElement('div');
    box.className = 'worktable';
    const massLabel = w.massLabel || 'mass / g';
    let head = '<tr><th></th>' + w.elements.map(e=>`<th>${fmtFormula(e)}</th>`).join('') + '</tr>';
    let massRow = `<tr><td>${massLabel}</td>` + w.mass.map(m=>`<td class="mono">${m.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}</td>`).join('') + '</tr>';
    let moleRow = '<tr><td>moles (your working)</td>' + w.elements.map((e,i)=>`<td><input class="cell" data-el="${i}" inputmode="decimal" placeholder="?" /></td>`).join('') + '</tr>';
    box.innerHTML = `<div class="worktable-title">Optional working &mdash; fill in the moles yourself</div>
      <table>${head}${massRow}${moleRow}</table>
      <div class="worktable-actions">
        <button type="button" class="btn btn-ghost btn-sm" data-action="check-work">Check my moles</button>
        <span class="worktable-note">${w.note ? w.note : 'not graded &mdash; just a sanity check before you commit to a final answer'}</span>
      </div>`;
    box.querySelector('[data-action="check-work"]').addEventListener('click', ()=>{
      const inputs = box.querySelectorAll('input.cell');
      inputs.forEach((inp,i)=>{
        const correct = w.moles[i];
        const val = parseFloat(inp.value);
        inp.classList.remove('ok','no');
        if (!isNaN(val) && Math.abs(val-correct) <= Math.max(0.0005, correct*0.03)){
          inp.classList.add('ok');
        } else {
          inp.classList.add('no');
        }
      });
    });
    return box;
  }

      continueRow.className = 'action-row'; continueRow.id = 'reflectActions';

    card.appendChild(badBanner);

    const explain = document.createElement('div');
    explain.className = 'explain'; explain.id = 'explainBox'; explain.style.display='none';
    explain.innerHTML = `<div class="explain-title">Worked solution</div>${q.explanation}`;
    card.appendChild(explain);
    if (state.solved.has(q.id) || state.gaveUp.has(q.id)) explain.style.display = 'block';

    // action row
    const actions = document.createElement('div');
    actions.className = 'action-row';
    actions.innerHTML = `
      <button type="button" class="btn btn-primary" data-action="check">Check answer</button>
      <button type="button" class="btn btn-amber" data-action="hint">Hint (1/${q.hints.length})</button>
      <button type="button" class="btn btn-ghost" data-action="reveal" style="display:none;">Show solution</button>
    `;
    card.appendChild(actions);

    stage.appendChild(card);

    renderHints(card, q);

    actions.querySelector('[data-action="check"]').addEventListener('click', ()=> handleCheck(card, q));
    actions.querySelector('[data-action="hint"]').addEventListener('click', ()=> handleHint(card, q));
    actions.querySelector('[data-action="reveal"]').addEventListener('click', ()=> handleReveal(card, q));

    // if already solved, reflect UI state
    if (state.solved.has(q.id)){
      q.parts.forEach(p=>{ markPartSolved(card, q, p); });
      goodBanner.classList.add('show');
    }
    updateRevealButton(card, q);
    renderFooter(card, q, state.solved.has(q.id) || state.gaveUp.has(q.id));
  }

  function renderHints(card, q){
    const box = document.createElement('div');
    box.className = 'hint-box'; box.id='hintBox'; box.style.display='none';
    box.innerHTML = '<ol id="hintList"></ol>';
    const actionRow = card.querySelector(':scope > .action-row');
    if (actionRow) card.insertBefore(box, actionRow);
    else card.appendChild(box);
  }

  function handleHint(card, q){
    const box = card.querySelector('#hintBox');
    const list = card.querySelector('#hintList');
    const shown = state.revealedHints[q.id] || 0;
    if (shown >= q.hints.length) return;
    const li = document.createElement('li');
    li.textContent = q.hints[shown];
    list.appendChild(li);
    state.revealedHints[q.id] = shown+1;
    box.style.display = 'block';
    const btn = card.querySelector('[data-action="hint"]');
    const n = state.revealedHints[q.id];
    if (n >= q.hints.length){
      btn.disabled = true;
      btn.textContent = 'All hints shown';
    } else {
      btn.textContent = `Hint (${n+1}/${q.hints.length})`;
    }
  }

  function renderPart(q, p){
    const wrap = document.createElement('div');
    wrap.className = 'part';
    wrap.dataset.partId = p.id;

    if (p.type === 'mc'){
      let opts = p.options.map((opt,i)=>`
        <label class="mc-opt" data-idx="${i}">
          <input type="radio" name="${q.id}-${p.id}" value="${i}">
          <span>${opt}</span>
        </label>`).join('');
      wrap.innerHTML = `<div class="part-label">${p.label}</div><div class="mc-options">${opts}</div><div class="part-feedback" id="fb-${p.id}"></div>`;
    } else {
      let placeholder = p.placeholder;
      if (!placeholder){
        if (p.type==='formula-empirical' || p.type==='formula-molecular') placeholder = 'e.g. Na2S2O3';
        else if (p.type==='numeric') placeholder = 'e.g. 6.94';
        else if (p.type==='kc') placeholder = 'e.g. [PCl5]/([PCl3][Cl2])';
        else if (p.type==='equation') placeholder = 'e.g. H2PO4- + H2O -> HPO4 2- + H3O+';
        else if (p.type==='keywords') placeholder = 'explain in a sentence or two';
        else placeholder = 'type your answer';
      }
      const field = p.multiline
        ? `<textarea class="answer-input" id="in-${p.id}" placeholder="${placeholder}" spellcheck="false" rows="2"></textarea>`
        : `<input class="answer-input" id="in-${p.id}" type="text" placeholder="${placeholder}" autocomplete="off" spellcheck="false">`;
      wrap.innerHTML = `<div class="part-label">${p.label}</div>
        <div class="part-row">
          ${field}
          ${p.unit ? `<span class="unit">${p.unit}</span>` : ''}
        </div>
        <div class="part-feedback" id="fb-${p.id}"></div>`;
    }
    return wrap;
  }

  function evalPart(p, card){
    if (p.type === 'mc'){
      const sel = card.querySelector(`.part[data-part-id="${p.id}"] input[type="radio"]:checked`);
      if (!sel) return {ok:false, empty:true};
      return {ok: parseInt(sel.value,10) === p.correctIndex, empty:false};
    }
    const input = card.querySelector(`#in-${p.id}`);
    const val = input ? input.value.trim() : '';
    if (!val) return {ok:false, empty:true};
    let ok = false;
    if (p.type === 'formula-empirical') ok = checkEmpirical(val, p.correct);
    else if (p.type === 'formula-molecular') ok = checkMolecular(val, p.correct);
    else if (p.type === 'numeric') ok = checkNumeric(val, p.correct, p.tolPct);
    else if (p.type === 'text') ok = p.accept.some(a=>a.toLowerCase()===val.toLowerCase());
    else if (p.type === 'keywords') ok = checkKeywords(val, p.groups);
    else if (p.type === 'equation') ok = checkEquation(val, p.required, p.forbidden);
    else if (p.type === 'kc') ok = checkKcExpression(val, p.numerator, p.denominator);
    return {ok, empty:false, parsedFail: (p.type==='formula-empirical'||p.type==='formula-molecular') && parseFormula(val)===null};
  }

  function markPartFeedback(card, q, p, result){
    const fb = card.querySelector(`#fb-${p.id}`);
    if (p.type === 'mc'){
      const optEls = card.querySelectorAll(`.part[data-part-id="${p.id}"] .mc-opt`);
      const selEl = card.querySelector(`.part[data-part-id="${p.id}"] input[type="radio"]:checked`);
      if (result.ok){
        selEl.closest('.mc-opt').classList.add('correct');
        optEls.forEach(o=>o.classList.add('disabled'));
        fb.textContent = 'Correct.'; fb.className = 'part-feedback good';
      } else {
        if (selEl) selEl.closest('.mc-opt').classList.add('incorrect');
        fb.textContent = 'Not this one.'; fb.className = 'part-feedback bad';
      }
      return;
    }
    const input = card.querySelector(`#in-${p.id}`);
    input.classList.remove('correct','incorrect');
    if (result.empty){ fb.textContent=''; return; }
    if (result.ok){
      input.classList.add('correct');
      fb.textContent = '\u2713 correct'; fb.className = 'part-feedback good';
    } else {
      input.classList.add('incorrect');
      if (result.parsedFail) fb.textContent = "Couldn't read that formula \u2014 check capitalization and format, e.g. Na2S2O3 or CoSO4.7H2O";
      else fb.textContent = 'Not quite \u2014 try again, or use a hint.';
      fb.className = 'part-feedback bad';
    }
  }

  function markPartSolved(card, q, p){
    if (p.type === 'mc'){
      const optEls = card.querySelectorAll(`.part[data-part-id="${p.id}"] .mc-opt`);
      optEls.forEach((o,i)=>{ if (i===p.correctIndex) o.classList.add('correct'); o.classList.add('disabled'); });
      return;
    }
    const input = card.querySelector(`#in-${p.id}`);
    if (input){
      input.value = (p.type === 'numeric') ? String(p.correct) : p.correct;
      input.classList.add('correct');
    }
  }

  function handleCheck(card, q){
    const results = q.parts.map(p=>evalPart(p, card));
    q.parts.forEach((p,i)=> markPartFeedback(card, q, p, results[i]));

    const anyEmpty = results.some(r=>r.empty);
    const allOk = results.every(r=>r.ok) && !anyEmpty;

    const goodBanner = card.querySelector('#goodBanner');
    const badBanner = card.querySelector('#badBanner');
    goodBanner.classList.remove('show'); badBanner.classList.remove('show');

    if (anyEmpty){
      card.querySelector('#badBannerText').textContent = 'Fill in every box before checking.';
      badBanner.classList.add('show');
      return;
    }

    state.attempts[q.id] = (state.attempts[q.id]||0) + 1;

    if (allOk){
      if (state.attempts[q.id] === 1 && (state.revealedHints[q.id]||0) === 0) state.firstTry.add(q.id);
      state.solved.add(q.id);
      updateProgress();
      goodBanner.classList.add('show');
      renderFooter(card, q, true);
      card.querySelector('[data-action="check"]').disabled = true;
      const explain = card.querySelector('#explainBox');
      explain.style.display = 'block';
    } else {
      card.querySelector('#badBannerText').textContent = 'Not everything checks out yet \u2014 see which box turned red, then have another go.';
      badBanner.classList.add('show');
      updateRevealButton(card, q);
    }
  }

  function updateRevealButton(card, q){
    const btn = card.querySelector('[data-action="reveal"]');
    if (!btn) return;
    if ((state.attempts[q.id]||0) >= 3 && !state.solved.has(q.id)){
      btn.style.display = 'inline-flex';
    }
  }

  function handleReveal(card, q){
    state.gaveUp.add(q.id);
    q.parts.forEach(p=> markPartSolved(card, q, p));
    card.querySelector('#explainBox').style.display = 'block';
    card.querySelector('#goodBanner').classList.remove('show');
    card.querySelector('#badBanner').classList.remove('show');
    card.querySelector('[data-action="check"]').disabled = true;
    card.querySelector('[data-action="reveal"]').style.display = 'none';
    renderFooter(card, q, true);
  }

  function renderFooter(card, q, canAdvance){
    let footer = card.querySelector('.footer-nav');
    if (footer) footer.remove();
    footer = document.createElement('div');
    footer.className = 'footer-nav';
    const isLast = state.current === Q.length - 1;
    footer.innerHTML = `
      <button type="button" class="btn btn-ghost" data-action="prev" ${state.current===0?'disabled':''}>&larr; Previous</button>
      <button type="button" class="btn btn-primary" data-action="next" ${canAdvance? '' : 'disabled'}>${isLast? 'Finish' : 'Next question &rarr;'}</button>
    `;
    card.appendChild(footer);
    footer.querySelector('[data-action="prev"]').addEventListener('click', ()=> goTo(Math.max(0,state.current-1)));
    footer.querySelector('[data-action="next"]').addEventListener('click', ()=>{
      if (isLast) renderComplete(); else goTo(state.current+1);
    });
  }

  function renderComplete(){
    stage.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card complete-card';
    const firstTry = state.firstTry.size;
    const total = Q.length;
    card.innerHTML = `
      <div class="big">&#x1F9EA;</div>
      <h2 style="margin-top:10px;">Workbook complete</h2>
      <p style="color:var(--ink-soft); margin-top:8px;">You've worked through exercises 24&ndash;35 on empirical and molecular formulas.</p>
      <div class="score-grid">
        <div class="score-tile"><b>${total}</b><span>questions completed</span></div>
        <div class="score-tile"><b>${firstTry}</b><span>solved first try, no hints</span></div>
        <div class="score-tile"><b>${state.gaveUp.size}</b><span>solutions revealed</span></div>
      </div>
      <button type="button" class="btn btn-ghost" data-action="restart">Review from the start</button>
    `;
    stage.appendChild(card);
    card.querySelector('[data-action="restart"]').addEventListener('click', ()=> goTo(0));
  }

  /* ============ calculator ============ */
  const CALC_CONSTS = {
    h: {v:6.63e-34, title:'Planck constant, h = 6.63x10^-34 J s'},
    L: {v:6.02e23, title:'Avogadro constant, L = 6.02x10^23 /mol'},
    R: {v:8.31, title:'Gas constant, R = 8.31 J K^-1 mol^-1'},
    c: {v:2.998e8, title:'Speed of light, c = 2.998x10^8 m/s'}
  };
  const CALC_BUTTONS = [
    {key:'ln', label:'ln', action:'func', value:'ln', cls:'fn'}, {key:'log', label:'log', action:'func', value:'log', cls:'fn'}, {key:'sqrt', label:'&radic;', action:'func', value:'sqrt', cls:'fn'}, {key:'sq', label:'x<sup>2</sup>', action:'func', value:'sq', cls:'fn'},
    {key:'exp', label:'e<sup>x</sup>', action:'func', value:'exp', cls:'fn'}, {key:'pow10', label:'10<sup>x</sup>', action:'func', value:'pow10', cls:'fn'}, {key:'pow', label:'x<sup>y</sup>', action:'op', value:'^', cls:'op'}, {key:'recip', label:'1/x', action:'func', value:'recip', cls:'fn'},
    {key:'lparen', label:'(', action:'lparen', cls:'op'}, {key:'rparen', label:')', action:'rparen', cls:'op'}, {key:'ee', label:'EE', action:'ee', cls:'op'}, {key:'sign', label:'&plusmn;', action:'sign', cls:'op'},
    {key:'clear', label:'C', action:'clear', cls:'ctrl'}, {key:'back', label:'&#9003;', action:'back', cls:'ctrl'}, {key:'mc', label:'MC', action:'mc', cls:'ctrl', title:'Clear memory'}, {key:'mr', label:'MR', action:'mr', cls:'mem', title:'Recall memory'},
    {key:'mplus', label:'M+', action:'mplus', cls:'mem', title:'Add displayed value to memory'}, {key:'mminus', label:'M&minus;', action:'mminus', cls:'mem', title:'Subtract displayed value from memory'}, {key:'const_h', label:'h', action:'const', value:'h', cls:'mem', title:CALC_CONSTS.h.title}, {key:'const_L', label:'L', action:'const', value:'L', cls:'mem', title:CALC_CONSTS.L.title},
    {key:'const_R', label:'R', action:'const', value:'R', cls:'mem', title:CALC_CONSTS.R.title}, {key:'const_c', label:'c', action:'const', value:'c', cls:'mem', title:CALC_CONSTS.c.title},
    {key:'d7', label:'7', action:'digit', value:'7'}, {key:'d8', label:'8', action:'digit', value:'8'}, {key:'d9', label:'9', action:'digit', value:'9'}, {key:'div', label:'&divide;', action:'op', value:'/', cls:'op'},
    {key:'d4', label:'4', action:'digit', value:'4'}, {key:'d5', label:'5', action:'digit', value:'5'}, {key:'d6', label:'6', action:'digit', value:'6'}, {key:'mul', label:'&times;', action:'op', value:'*', cls:'op'},
    {key:'d1', label:'1', action:'digit', value:'1'}, {key:'d2', label:'2', action:'digit', value:'2'}, {key:'d3', label:'3', action:'digit', value:'3'}, {key:'sub', label:'&minus;', action:'op', value:'-', cls:'op'},
    {key:'d0', label:'0', action:'digit', value:'0'}, {key:'dot', label:'.', action:'decimal'}, {key:'eq', label:'=', action:'equals', cls:'eq'}, {key:'add', label:'+', action:'op', value:'+', cls:'op'}
  ];

  let calcTokens = [];        // finalized tokens: {t:'num'|'op'|'lparen'|'rparen'|'func', v}
  let calcCurNum = null;      // string being typed right now, or null
  let calcMemory = 0;
  let calcShowingResult = false;
  let calcLastResult = 0;
  let calcResultPrevExpr = '';

  function calcInExponent(){ return calcCurNum !== null && calcCurNum.indexOf('e') !== -1; }

  function calcFormat(n){
    if (n===null || n===undefined || isNaN(n) || !isFinite(n)) return 'Error';
    if (n===0) return '0';
    const abs = Math.abs(n);
    if (abs < 1e-6 || abs >= 1e10){
      let s = n.toExponential(6);
      s = s.replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e').replace('e+','e');
      return s;
    }
    return parseFloat(n.toPrecision(10)).toString();
  }
  function calcOpSymbol(op){ return {'+':'+','-':'\u2212','*':'\u00D7','/':'\u00F7','^':'^'}[op] || op; }
  function calcFuncLabel(fn){ return {ln:'ln', log:'log', exp:'e^', pow10:'10^', sqrt:'\u221A', sq:'sq', recip:'1/'}[fn] || fn; }

  function calcBeginFresh(){
    calcTokens = []; calcCurNum = null; calcShowingResult = false; calcResultPrevExpr = '';
  }
  function calcParseCurNum(s){
    const v = parseFloat(s);
    return isNaN(v) ? 0 : v;
  }
  function calcCommitCurNum(){
    if (calcCurNum !== null){
      calcTokens.push({t:'num', v:calcParseCurNum(calcCurNum)});
      calcCurNum = null;
    }
  }
  function calcMaybeInsertImplicitMul(){
    const last = calcTokens[calcTokens.length-1];
    if (last && (last.t==='num' || last.t==='rparen')) calcTokens.push({t:'op', v:'*'});
  }
  function calcOpenParenCount(){
    let n = 0;
    calcTokens.forEach(t=>{ if (t.t==='lparen') n++; if (t.t==='rparen') n--; });
    return n;
  }

  function calcTokensToString(tokens){
    let s = '';
    tokens.forEach(tok=>{
      if (tok.t==='num') s += calcFormat(tok.v);
      else if (tok.t==='op') s += ' ' + calcOpSymbol(tok.v) + ' ';
      else if (tok.t==='lparen') s += '(';
      else if (tok.t==='rparen') s += ')';
      else if (tok.t==='func') s += calcFuncLabel(tok.v);
    });
    return s;
  }
  function calcLiveExprString(){
    let s = calcTokensToString(calcTokens);
    if (calcCurNum !== null) s += calcCurNum;
    return s;
  }

  function calcApplyFunc(fn, x){
    switch(fn){
      case 'ln': return Math.log(x);
      case 'log': return Math.log10(x);
      case 'exp': return Math.exp(x);
      case 'pow10': return Math.pow(10, x);
      case 'sqrt': return Math.sqrt(x);
      case 'sq': return x*x;
      case 'recip': return x === 0 ? NaN : 1/x;
      default: return x;
    }
  }
  function calcEvalTokens(tokens){
    let pos = 0;
    function peek(){ return tokens[pos]; }
    function take(){ return tokens[pos++]; }
    function parseExpression(){
      let v = parseTerm();
      while (peek() && peek().t==='op' && (peek().v==='+' || peek().v==='-')){
        const op = take().v;
        const rhs = parseTerm();
        v = op==='+' ? v+rhs : v-rhs;
      }
      return v;
    }
    function parseTerm(){
      let v = parsePower();
      while (peek() && peek().t==='op' && (peek().v==='*' || peek().v==='/')){
        const op = take().v;
        const rhs = parsePower();
        v = op==='*' ? v*rhs : (rhs===0 ? NaN : v/rhs);
      }
      return v;
    }
    function parsePower(){
      let v = parseUnary();
      if (peek() && peek().t==='op' && peek().v==='^'){
        take();
        const rhs = parsePower();
        v = Math.pow(v, rhs);
      }
      return v;
    }
    function parseUnary(){
      if (peek() && peek().t==='op' && peek().v==='-'){ take(); return -parseUnary(); }
      if (peek() && peek().t==='op' && peek().v==='+'){ take(); return parseUnary(); }
      return parsePrimary();
    }
    function parsePrimary(){
      const tok = peek();
      if (!tok) throw new Error('unexpected end');
      if (tok.t==='num'){ take(); return tok.v; }
      if (tok.t==='lparen'){
        take();
        const v = parseExpression();
        if (peek() && peek().t==='rparen') take();
        return v;
      }
      if (tok.t==='func'){
        take();
        if (peek() && peek().t==='lparen') take();
        const v = parseExpression();
        if (peek() && peek().t==='rparen') take();
        return calcApplyFunc(tok.v, v);
      }
      throw new Error('unexpected token');
    }
    if (tokens.length === 0) return 0;
    return parseExpression();
  }
  function calcEvaluateCurrentValue(){
    if (calcShowingResult) return calcLastResult;
    const tokens = calcTokens.slice();
    if (calcCurNum !== null) tokens.push({t:'num', v:calcParseCurNum(calcCurNum)});
    let result;
    try { result = calcEvalTokens(tokens); } catch(e){ result = NaN; }
    return isNaN(result) || !isFinite(result) ? 0 : result;
  }

  function calcRender(){
    const valEl = document.getElementById('calcVal');
    const exprEl = document.getElementById('calcExpr');
    if (calcShowingResult){
      if (exprEl) exprEl.textContent = calcResultPrevExpr + ' =';
      if (valEl) valEl.textContent = calcFormat(calcLastResult);
    } else {
      const live = calcLiveExprString();
      if (exprEl) exprEl.textContent = '\u00A0';
      if (valEl) valEl.textContent = live === '' ? '0' : live;
    }
    const memEl = document.getElementById('calcMemInd');
    if (memEl) memEl.style.visibility = (calcMemory !== 0) ? 'visible' : 'hidden';
  }

  function calcPressDigit(d){
    if (calcShowingResult) calcBeginFresh();
    if (calcCurNum === null) calcCurNum = '0';
    if (calcCurNum === '0' && !calcInExponent()) calcCurNum = d;
    else calcCurNum += d;
    calcRender();
  }
  function calcPressDecimal(){
    if (calcShowingResult) calcBeginFresh();
    if (calcCurNum === null) calcCurNum = '0';
    if (calcInExponent()) return;
    if (calcCurNum.indexOf('.') === -1) calcCurNum += '.';
    calcRender();
  }
  function calcPressEE(){
    if (calcShowingResult) calcBeginFresh();
    if (calcCurNum === null) calcCurNum = '0';
    if (!calcInExponent()) calcCurNum += 'e';
    calcRender();
  }
  function calcPressSign(){
    if (calcShowingResult) calcBeginFresh();
    if (calcCurNum === null) calcCurNum = '0';
    if (calcInExponent()){
      const idx = calcCurNum.indexOf('e');
      let mant = calcCurNum.slice(0, idx+1);
      let exp = calcCurNum.slice(idx+1);
      exp = exp.charAt(0)==='-' ? exp.slice(1) : ('-'+exp);
      calcCurNum = mant + exp;
    } else if (calcCurNum !== '0') {
      calcCurNum = calcCurNum.charAt(0)==='-' ? calcCurNum.slice(1) : ('-'+calcCurNum);
    }
    calcRender();
  }
  function calcPressBackspace(){
    if (calcShowingResult) return;
    if (calcCurNum !== null){
      calcCurNum = calcCurNum.slice(0, -1);
      if (calcCurNum === '' || calcCurNum === '-') calcCurNum = null;
    } else if (calcTokens.length){
      calcTokens.pop();
    }
    calcRender();
  }
  function calcClear(){
    calcBeginFresh();
    calcRender();
  }
  function calcPressOp(op){
    if (calcShowingResult){
      calcTokens = [{t:'num', v:calcLastResult}];
      calcCurNum = null; calcShowingResult = false; calcResultPrevExpr = '';
    } else {
      calcCommitCurNum();
    }
    calcTokens.push({t:'op', v:op});
    calcRender();
  }
  function calcPressLParen(){
    if (calcShowingResult) calcBeginFresh();
    calcCommitCurNum();
    calcMaybeInsertImplicitMul();
    calcTokens.push({t:'lparen'});
    calcRender();
  }
  function calcPressRParen(){
    if (calcShowingResult) return;
    calcCommitCurNum();
    if (calcOpenParenCount() > 0) calcTokens.push({t:'rparen'});
    calcRender();
  }
  function calcPressFunc(fn){
    if (calcShowingResult) calcBeginFresh();
    calcCommitCurNum();
    calcMaybeInsertImplicitMul();
    calcTokens.push({t:'func', v:fn});
    calcTokens.push({t:'lparen'});
    calcRender();
  }
  function calcInsertLiteral(v){
    if (calcShowingResult) calcBeginFresh();
    calcCommitCurNum();
    calcMaybeInsertImplicitMul();
    calcTokens.push({t:'num', v:v});
    calcRender();
  }
  function calcInsertConst(key){
    const c = CALC_CONSTS[key];
    if (c) calcInsertLiteral(c.v);
  }
  function calcMemClear(){ calcMemory = 0; calcRender(); }
  function calcMemRecall(){ calcInsertLiteral(calcMemory); }
  function calcMemAdd(){ calcMemory += calcEvaluateCurrentValue(); calcRender(); }
  function calcMemSub(){ calcMemory -= calcEvaluateCurrentValue(); calcRender(); }
  function calcPressEquals(){
    calcCommitCurNum();
    const openCount = calcOpenParenCount();
    for (let i=0; i<openCount; i++) calcTokens.push({t:'rparen'});
    const exprStr = calcTokensToString(calcTokens);
    let result;
    try { result = calcEvalTokens(calcTokens); } catch(e){ result = NaN; }
    calcLastResult = result;
    calcResultPrevExpr = exprStr === '' ? '0' : exprStr;
    calcShowingResult = true;
    calcTokens = [];
    calcCurNum = null;
    calcRender();
  }

  function buildCalc(){
    const grid = document.getElementById('calcGrid');
    CALC_BUTTONS.forEach(spec=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'calc-btn' + (spec.cls ? ' '+spec.cls : '');
      btn.dataset.key = spec.key;
      btn.innerHTML = spec.label;
      if (spec.title) btn.title = spec.title;
      btn.addEventListener('click', ()=>{
        switch(spec.action){
          case 'digit': calcPressDigit(spec.value); break;
          case 'op': calcPressOp(spec.value); break;
          case 'decimal': calcPressDecimal(); break;
          case 'ee': calcPressEE(); break;
          case 'sign': calcPressSign(); break;
          case 'back': calcPressBackspace(); break;
          case 'clear': calcClear(); break;
          case 'equals': calcPressEquals(); break;
          case 'lparen': calcPressLParen(); break;
          case 'rparen': calcPressRParen(); break;
          case 'func': calcPressFunc(spec.value); break;
          case 'mc': calcMemClear(); break;
          case 'mr': calcMemRecall(); break;
          case 'mplus': calcMemAdd(); break;
          case 'mminus': calcMemSub(); break;
          case 'const': calcInsertConst(spec.value); break;
        }
      });
      grid.appendChild(btn);
    });
  }
  function initCalcUI(){
    buildCalc();
    calcRender();
    const fab = document.getElementById('calcFab');
    const panel = document.getElementById('calcPanel');
    const closeBtn = document.getElementById('calcClose');
    fab.addEventListener('click', ()=> panel.classList.toggle('open'));
    closeBtn.addEventListener('click', ()=> panel.classList.remove('open'));

    const header = document.getElementById('calcHeader');
    let dragging = false, offsetX = 0, offsetY = 0;
    header.addEventListener('pointerdown', (e)=>{
      dragging = true;
      const rect = panel.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      panel.style.right = 'auto'; panel.style.bottom = 'auto';
      panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
      header.setPointerCapture(e.pointerId);
    });
    header.addEventListener('pointermove', (e)=>{
      if (!dragging) return;
      const maxX = window.innerWidth - panel.offsetWidth - 4;
      const maxY = window.innerHeight - panel.offsetHeight - 4;
      panel.style.left = Math.min(Math.max(0, e.clientX - offsetX), maxX) + 'px';
      panel.style.top = Math.min(Math.max(0, e.clientY - offsetY), maxY) + 'px';
    });
    header.addEventListener('pointerup', ()=> dragging = false);
    header.addEventListener('pointercancel', ()=> dragging = false);
  }

  updateProgress();
  render();
  initCalcUI();
})();
</script>
